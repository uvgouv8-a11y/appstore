name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm install
          npx cap add android
          cp google-services.json android/app/google-services.json
          sed -i 's/minSdkVersion = 2[0-9]/minSdkVersion = 24/' android/variables.gradle
          npx cap sync android
      - name: Add Firebase dependencies
        run: |
          cat >> android/app/build.gradle <<'EOF'

          dependencies {
              implementation platform('com.google.firebase:firebase-bom:33.1.2')
              implementation 'com.google.firebase:firebase-auth'
              implementation 'com.google.android.gms:play-services-auth:21.2.0'
              implementation 'androidx.credentials:credentials:1.2.2'
              implementation 'androidx.credentials:credentials-play-services-auth:1.2.2'
              implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
          }
          EOF
      - name: Fixed debug key
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell monkey -p com.appstore.market -c android.intent.category.LAUNCHER 1
            sleep 30
            adb logcat -d | grep -E "NoClassDefFound|ClassNotFound|Caused by|FATAL|Capacitor" | sed 's/.*AndroidRuntime: //' | cut -c1-250 > error.txt
      - name: Save error log
        if: always()
        run: |
          rm -f crash.log
          touch error.txt
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A error.txt crash.log || true
          git commit -m "error log [skip ci]" || true
          git push || true
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AppStore build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
